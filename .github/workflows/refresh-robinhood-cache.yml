name: Refresh Robinhood Cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROBINHOOD_USERNAME: ${{ secrets.ROBINHOOD_USERNAME }}
      ROBINHOOD_PASSWORD: ${{ secrets.ROBINHOOD_PASSWORD }}
      ROBINHOOD_TOTP_SECRET: ${{ secrets.ROBINHOOD_TOTP_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        id: secrets
        run: |
          missing=0
          if [ -z "$ROBINHOOD_USERNAME" ]; then
            echo "::warning::Missing ROBINHOOD_USERNAME secret; skipping cache refresh."
            missing=1
          fi
          if [ -z "$ROBINHOOD_PASSWORD" ]; then
            echo "::warning::Missing ROBINHOOD_PASSWORD secret; skipping cache refresh."
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install robin-stocks pyotp

      - name: Refresh cache
        if: steps.secrets.outputs.ready == 'true'
        run: python scripts/refresh_cache.py --json-only --force
